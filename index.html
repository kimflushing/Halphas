<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character OS</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- 로그인 화면 -->

<div id="login-screen">


    <div class="login-box">


        <div class="profile">

            🌺

        </div>


        <h2>
            Character OS
        </h2>


        <p>
            Welcome back
        </p>


        <input 
        type="password"
        id="password"
        placeholder="Password">


        <button onclick="login()">
            Login
        </button>


    </div>


</div>




<!-- 바탕화면 -->


<div id="desktop" style="display:none;">



    <div class="desktop-icons">


        <div class="desktop-icon">

            💬

            <span>
            Messages
            </span>

        </div>



        <div class="desktop-icon">

            📷

            <span>
            Photos
            </span>

        </div>



        <div class="desktop-icon">

            🌐

            <span>
            Browser
            </span>

        </div>



        <div class="desktop-icon">

            📁

            <span>
            Files
            </span>

        </div>


    </div>




    <!-- 작업표시줄 -->


    <div class="taskbar">


        <div class="start">
            ⊞
        </div>


        <div class="apps">

            💬
            🌐
            📁

        </div>


        <div id="clock">

            00:00

        </div>


    </div>



</div>




<script src="js/script.js"></script>


</body>

</html>
