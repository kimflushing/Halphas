<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FakeOS</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- =========================
부팅화면
========================= -->

<div id="bootScreen">

    <div class="boot-logo">
        <h1>FAKE OS</h1>
        <p>Loading...</p>

        <div class="loader">
            <div></div>
        </div>

    </div>

</div>

<!-- =========================
로그인
========================= -->

<div id="loginScreen">

    <div class="login-box">

        <img src="https://picsum.photos/150" id="profile">

        <h2>User</h2>

        <input
        type="password"
        id="password"
        placeholder="Password">

        <button id="loginBtn">
            로그인
        </button>

        <p id="loginError"></p>

    </div>

</div>

<!-- =========================
Desktop
========================= -->

<div id="desktop">

<div id="desktopIcons">


<div class="icon" data-app="explorer">

📁

<span>파일</span>

</div>


<div class="icon" data-app="notepad">

📄

<span>메모장</span>

</div>


<div class="icon" data-app="gallery">

🖼️

<span>사진</span>

</div>


<div class="icon" data-app="player">

🎵

<span>음악</span>

</div>


<div class="icon" data-app="browser">

🌐

<span>브라우저</span>

</div>


<div class="icon" data-app="calendar">

📅

<span>달력</span>

</div>


<div class="icon" data-app="settings">

⚙️

<span>설정</span>

</div>


<div class="icon" data-app="system">

💻

<span>시스템</span>

</div>


<div class="icon" data-app="trash">

🗑️

<span>휴지통</span>

</div>


</div>

<!-- 창 생성 위치 -->

<div id="windows"></div>

<!-- 작업표시줄 -->

<div id="taskbar">

<div id="startButton">
☰
</div>

<div id="taskApps">
</div>

<div id="clock">
00:00
</div>

</div>

<!-- 시작 메뉴 -->

<div id="startMenu">

<button id="openExplorer">
📁 파일 탐색기
</button>

<button id="openNotepad">
📄 메모장
</button>

<button id="openSettings">
⚙ 설정
</button>

<button id="shutdown">
⏻ 종료
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>


</body>

</html>
