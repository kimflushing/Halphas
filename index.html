<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character OS</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- 로그인 화면 -->

<div class="login-screen">


    <div class="login-card">


        <div class="profile-circle">
            🌺
        </div>


        <h1>
            Character OS
        </h1>


        <h2>
            Fujimoto PC
        </h2>


        <p class="online">
            ● Online
        </p>


        <input 
        type="password"
        placeholder="Password">


        <button onclick="enterPC()">
            Enter
        </button>


        <div class="last">

            Last login<br>
            Hong Kong<br>
            22:31

        </div>


    </div>


</div>




<!-- 컴퓨터 화면 -->


<div class="computer" style="display:none;">


    <div class="desktop-icon">

        💬
        <span>
            Messages
        </span>

    </div>


    <div class="desktop-icon">

        📷
        <span>
            Photos
        </span>

    </div>


    <div class="desktop-icon">

        📁
        <span>
            Files
        </span>

    </div>



    <div class="taskbar">


        <div>
            ⊞
        </div>


        <div>
            💬 🌐 📁
        </div>


        <div id="clock">
            00:00
        </div>


    </div>


</div>



<script src="js/script.js"></script>


</body>

</html>
