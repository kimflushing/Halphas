<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Computer</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans KR',sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
}

/* 배경 */

body{

background-image:url("https://images.unsplash.com/photo-1505761671935-60b3a7427bad?auto=format&fit=crop&w=1600&q=80");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

}

/* 약간 어둡게 */

body::before{

content:"";

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.25);

backdrop-filter:blur(2px);

z-index:-1;

}

/* 데스크탑 */

.desktop{

width:100%;

height:100%;

position:relative;

}

/* 아이콘 */

.icon{

width:82px;

display:flex;

flex-direction:column;

align-items:center;

gap:8px;

cursor:pointer;

position:absolute;

user-select:none;

}

.icon img{

width:52px;

height:52px;

}

.icon span{

font-size:13px;

color:white;

text-shadow:0 0 5px black;

text-align:center;

}

/* 위치 */

#browser{
top:30px;
left:25px;
}

#messages{
top:145px;
left:25px;
}

#photos{
top:260px;
left:25px;
}

#notes{
top:375px;
left:25px;
}

#documents{
top:490px;
left:25px;
}

#trash{
top:605px;
left:25px;
}
/* ========================= */
/* 작업표시줄 */
/* ========================= */

.taskbar{

position:fixed;

bottom:0;

left:0;

width:100%;

height:58px;

background:rgba(28,28,28,.82);

backdrop-filter:blur(20px);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 18px;

border-top:1px solid rgba(255,255,255,.12);

}

/* 시작 버튼 */

.start{

width:42px;

height:42px;

border-radius:12px;

background:rgba(255,255,255,.08);

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

color:white;

cursor:pointer;

transition:.2s;

}

.start:hover{

background:rgba(255,255,255,.16);

}

/* 가운데 아이콘 */

.task-icons{

display:flex;

gap:14px;

align-items:center;

}

.task-icon{

width:40px;

height:40px;

border-radius:12px;

background:rgba(255,255,255,.08);

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

color:white;

cursor:pointer;

transition:.2s;

}

.task-icon:hover{

background:rgba(255,255,255,.15);

}

/* 시계 */

.clock{

color:white;

font-size:14px;

font-weight:500;

}

/* ========================= */
/* 창 */
/* ========================= */

.window{

position:absolute;

top:90px;

left:140px;

width:340px;

height:420px;

background:#f6f6f6;

border-radius:14px;

overflow:hidden;

display:none;

box-shadow:0 15px 40px rgba(0,0,0,.45);

}

/* 제목 */

.window-top{

height:46px;

background:#e9e9e9;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 16px;

font-weight:600;

}

/* 닫기 */

.close{

width:30px;

height:30px;

border-radius:8px;

background:#ff4d4d;

display:flex;

justify-content:center;

align-items:center;

color:white;

cursor:pointer;

}

/* 내용 */

.window-content{

padding:18px;

height:calc(100% - 46px);

overflow:auto;

}

/* 모바일 */

@media(max-width:700px){

.window{

width:92%;

left:4%;

top:50px;

height:70%;

}

.icon{

transform:scale(.92);

}

}

</style>
<body>

<div class="desktop">

    <!-- 아이콘 -->

    <div class="icon" id="browser" onclick="openWindow('browserWindow')">
        <img src="https://img.icons8.com/color/96/internet.png">
        <span>Browser</span>
    </div>

    <div class="icon" id="messages" onclick="openWindow('messageWindow')">
        <img src="https://img.icons8.com/color/96/chat--v1.png">
        <span>Messages</span>
    </div>

    <div class="icon" id="photos" onclick="openWindow('photoWindow')">
        <img src="https://img.icons8.com/color/96/pictures-folder.png">
        <span>Photos</span>
    </div>

    <div class="icon" id="notes" onclick="openWindow('noteWindow')">
        <img src="https://img.icons8.com/color/96/notepad.png">
        <span>Notes</span>
    </div>

    <div class="icon" id="documents" onclick="openWindow('documentWindow')">
        <img src="https://img.icons8.com/color/96/documents.png">
        <span>Documents</span>
    </div>

    <div class="icon" id="trash">
        <img src="https://img.icons8.com/color/96/recycle-bin.png">
        <span>Recycle Bin</span>
    </div>

    <!-- Browser -->

    <div class="window" id="browserWindow">

        <div class="window-top">

            Browser

            <div class="close" onclick="closeWindow('browserWindow')">
                ✕
            </div>

        </div>

        <div class="window-content">

            <h2>Welcome.</h2>

            <br>

            <p>브라우저는 아직 준비 중...</p>

        </div>

    </div>

    <!-- Messages -->

    <div class="window" id="messageWindow">

        <div class="window-top">

            Messages

            <div class="close" onclick="closeWindow('messageWindow')">
                ✕
            </div>

        </div>

        <div class="window-content">

            <h3>❤️ 츠바키군</h3>

            <br>

            <p>오늘도 조심해서 와.</p>

        </div>

    </div>

    <!-- Photos -->

    <div class="window" id="photoWindow">

        <div class="window-top">

            Photos

            <div class="close" onclick="closeWindow('photoWindow')">
                ✕
            </div>

        </div>

        <div class="window-content">

            사진이 없습니다.

        </div>

    </div>

    <!-- Notes -->

    <div class="window" id="noteWindow">

        <div class="window-top">

            Notes

            <div class="close" onclick="closeWindow('noteWindow')">
                ✕

            </div>

        </div>

        <div class="window-content">

□ 장보기

<br><br>

□ 츠바키군 만나기

        </div>

    </div>
